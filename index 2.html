<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Street Drive V5</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111a;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
.top{display:flex;gap:7px;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 10px 0;font-weight:800;text-shadow:0 2px 5px #000}
.badge{background:#07101ccc;border:1px solid #ffffff30;border-radius:13px;padding:7px 10px;backdrop-filter:blur(6px)}
#controls{position:fixed;left:0;right:0;bottom:calc(15px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:68px;height:68px;border-radius:21px;background:#ffffff24;border:1px solid #fff4;color:white;font-size:28px;font-weight:900;backdrop-filter:blur(7px)}
#boost{width:84px;background:#ffb000d9;color:#111;font-size:14px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06101acc,#000c);color:#fff;z-index:5}
.card{width:min(90vw,410px);padding:27px;border-radius:25px;background:#101a28ee;border:1px solid #ffffff20;box-shadow:0 20px 70px #000}
h1{margin:0;font-size:39px;letter-spacing:1px}
.sub{margin:7px 0 19px;opacity:.72;line-height:1.4}
button.main{border:0;border-radius:16px;padding:15px 24px;font-size:18px;font-weight:900;background:#fff;color:#111;width:100%}
.row{display:flex;gap:9px;margin-top:10px}
button.small{flex:1;border:1px solid #fff3;border-radius:13px;padding:11px;background:#ffffff12;color:#fff;font-weight:800}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);padding:9px 15px;border-radius:20px;background:#000b;color:#fff;font-weight:800;opacity:0;transition:.2s;pointer-events:none}
@media(min-width:800px){.ctrl{width:80px;height:80px}.top{font-size:17px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top">
<div class="badge">🏁 STREET DRIVE V5</div>
<div class="badge">⭐ <span id="score">0</span></div>
<div class="badge">💰 <span id="coins">0</span></div>
<div class="badge">🏆 <span id="best">0</span></div>
</div></div>
<div id="toast"></div>
<div id="controls">
 <div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="pad"><button class="ctrl" id="boost">BOOST</button></div>
</div>
<div id="menu"><div class="card">
<h1>STREET DRIVE</h1>
<div class="sub">V5 • vozit, shmang trafikun, mbledh monedha dhe mbijeto sa më gjatë.</div>
<button class="main" id="start">START GAME</button>
<div class="row"><button class="small" id="mode">☀️ DAY</button><button class="small" id="sound">🔊 SOUND</button></div>
</div></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,playing=false,score=0,coins=0,speed=7,roadX=0,spawn=.2,coinSpawn=.5;
let night=false,soundOn=true,objects=[],particles=[],last=0;
let keys={left:false,right:false,boost:false};
let best=Number(localStorage.getItem('streetDriveV5Best')||0);
document.getElementById('best').textContent=best;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function road(){
 const horizon=H*.19, bottom=H+50, topW=Math.min(W*.36,250), botW=Math.min(W*.92,700);
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,night?'#030817':'#57b7e8'); sky.addColorStop(1,night?'#16284a':'#d8f3ff');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=night?'#10251b':'#2f7b39';ctx.fillRect(0,horizon,W,H);
 // distant buildings
 for(let i=0;i<13;i++){
   let x=(i/13)*W, bh=25+(i*17%75);
   ctx.fillStyle=night?'#162133':'#79949f';
   ctx.fillRect(x,horizon-bh*.35,Math.max(18,W/15),bh*.35);
 }
 ctx.fillStyle=night?'#55585f':'#858585';
 ctx.beginPath();ctx.moveTo(W/2-topW/2,horizon);ctx.lineTo(W/2+topW/2,horizon);ctx.lineTo(W/2+botW/2,bottom);ctx.lineTo(W/2-botW/2,bottom);ctx.closePath();ctx.fill();
 ctx.fillStyle=night?'#25272b':'#303136';
 ctx.beginPath();ctx.moveTo(W/2-topW*.43,horizon);ctx.lineTo(W/2+topW*.43,horizon);ctx.lineTo(W/2+botW*.43,bottom);ctx.lineTo(W/2-botW*.43,bottom);ctx.closePath();ctx.fill();
 // edge lines
 ctx.strokeStyle='#f7e7a5';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2-topW*.43,horizon);ctx.lineTo(W/2-botW*.43,bottom);ctx.moveTo(W/2+topW*.43,horizon);ctx.lineTo(W/2+botW*.43,bottom);ctx.stroke();
 // lane marks
 ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.setLineDash([30,27]);ctx.lineDashOffset=-roadX;
 for(const lane of [-.22,.22]){ctx.beginPath();ctx.moveTo(W/2+lane*topW,horizon);ctx.lineTo(W/2+lane*botW,bottom);ctx.stroke()}
 ctx.setLineDash([]);
 // lamps
 for(let i=0;i<7;i++){let p=i/7+.04, y=horizon+p*(H-horizon), side=(i%2?1:-1), x=W/2+side*(topW/2+p*(botW-topW)/2+20);
   ctx.strokeStyle=night?'#aab8c8':'#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-32-25*p);ctx.stroke();
   ctx.fillStyle=night?'#fff2a1':'#ddd';ctx.beginPath();ctx.arc(x,y-35-25*p,4,0,Math.PI*2);ctx.fill();
 }
}

function car(x,y,w,h,color,player=false){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,h*.42,w*.57,h*.13,0,0,Math.PI*2);ctx.fill();
 let g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#111');g.addColorStop(.18,color);g.addColorStop(.5,color);g.addColorStop(1,'#111');
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,13);ctx.fill();
 ctx.fillStyle='#172534';ctx.beginPath();ctx.roundRect(-w*.31,-h*.34,w*.62,h*.34,8);ctx.fill();
 ctx.fillStyle=player?'#dffaff':'#e8f0ff';ctx.fillRect(-w*.39,-h*.43,w*.17,h*.08);ctx.fillRect(w*.22,-h*.43,w*.17,h*.08);
 ctx.fillStyle='#111';ctx.fillRect(-w*.57,-h*.25,w*.12,h*.25);ctx.fillRect(w*.45,-h*.25,w*.12,h*.25);
 if(player){ctx.strokeStyle='#8ff';ctx.lineWidth=2;ctx.strokeRect(-w*.5,-h*.5,w,h)}
 ctx.restore();
}
function playerX(){return W/2+roadX}
function spawnObj(){let lane=[-.27,0,.27][Math.floor(Math.random()*3)];objects.push({type:'car',lane,y:-100,color:['#e74c3c','#3498db','#f1c40f','#9b59b6','#f5f5f5'][Math.floor(Math.random()*5)]})}
function spawnCoin(){let lane=[-.27,0,.27][Math.floor(Math.random()*3)];objects.push({type:'coin',lane,y:-40})}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,650)}
function update(dt){
 const boost=keys.boost?1.65:1;
 speed += ((7.2*boost)-speed)*dt*2;
 roadX += ((keys.right?1:0)-(keys.left?1:0))*W*.92*dt;
 roadX=Math.max(-W*.29,Math.min(W*.29,roadX));
 spawn-=dt;coinSpawn-=dt;
 if(spawn<=0){spawnObj();spawn=.62+Math.random()*.5}
 if(coinSpawn<=0){spawnCoin();coinSpawn=.85+Math.random()*1.1}
 for(const o of objects){o.y+=speed*100*dt}
 objects=objects.filter(o=>{
   const p=Math.max(0,Math.min(1,(o.y-H*.19)/(H*.81)));
   const ox=W/2+o.lane*(Math.min(W*.92,700)*(.36+.64*p));
   if(o.type==='coin' && Math.abs(ox-playerX())<58 && Math.abs(o.y-(H-125))<62){
      coins++;score+=35;toast('💰 +35'); return false;
   }
   if(o.type==='car' && Math.abs(ox-playerX())<54 && Math.abs(o.y-(H-125))<88){
      playing=false;best=Math.max(best,score);localStorage.setItem('streetDriveV5Best',best);
      document.getElementById('best').textContent=best;
      document.querySelector('.sub').textContent='💥 Përplasje! Rezultati: '+score+' • Monedha: '+coins;
      document.getElementById('start').textContent='RESTART';
      document.getElementById('menu').style.display='flex'; return false;
   }
   return o.y<H+130;
 });
 score+=Math.floor(speed*dt*2.2);
 document.getElementById('score').textContent=score;document.getElementById('coins').textContent=coins;
}
function draw(){
 ctx.clearRect(0,0,W,H);road();
 const horizon=H*.19, botW=Math.min(W*.92,700);
 for(const o of objects){
   const p=Math.max(0,Math.min(1,(o.y-horizon)/(H*.81)));
   const ox=W/2+o.lane*(botW*(.36+.64*p));
   if(o.type==='coin'){
     let r=10+13*p;ctx.save();ctx.translate(ox,o.y);ctx.rotate(performance.now()/300);
     ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#fff5a0';ctx.font='bold '+Math.max(11,r)+'px Arial';ctx.textAlign='center';ctx.fillText('€',0,r*.35);ctx.restore();
   } else car(ox,o.y,38+34*p,68+58*p,o.color);
 }
 car(playerX(),H-125,62,105,'#13d9ff',true);
 if(keys.boost){ctx.fillStyle='#ffb000';ctx.beginPath();ctx.moveTo(playerX()-14,H-73);ctx.lineTo(playerX(),H-22);ctx.lineTo(playerX()+14,H-73);ctx.fill()}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function bind(id,key){let el=document.getElementById(id);
 ['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true},{passive:false}));
 ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false},{passive:false}));
}
bind('left','left');bind('right','right');bind('boost','boost');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.code==='Space')keys.boost=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.code==='Space')keys.boost=false});
document.getElementById('start').onclick=()=>{playing=true;score=0;coins=0;speed=7;roadX=0;objects=[];spawn=.2;coinSpawn=.5;document.getElementById('menu').style.display='none';document.querySelector('.sub').textContent='V5 • vozit, shmang trafikun, mbledh monedha dhe mbijeto sa më gjatë.';document.getElementById('start').textContent='START GAME'};
document.getElementById('mode').onclick=()=>{night=!night;document.getElementById('mode').textContent=night?'🌙 NIGHT':'☀️ DAY'};
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 SOUND':'🔇 SOUND'};
</script>
</body>
</html>
