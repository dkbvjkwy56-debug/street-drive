<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Street Drive V2</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131a;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
.top{display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 0;font-weight:800;text-shadow:0 2px 5px #000}
.badge{background:#0008;border:1px solid #fff3;border-radius:14px;padding:8px 12px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#08111dcc,#000b);color:#fff;z-index:5}
.card{width:min(88vw,390px);padding:28px;border-radius:24px;background:#121823ee;border:1px solid #ffffff20;box-shadow:0 20px 60px #000}
h1{margin:0 0 6px;font-size:38px;letter-spacing:1px}
p{opacity:.75;margin:6px 0 22px}
button{border:0;border-radius:16px;padding:15px 24px;font-size:18px;font-weight:800;background:#fff;color:#111;width:100%}
#controls{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}
.ctrl{width:70px;height:70px;border-radius:22px;background:#ffffff24;border:1px solid #fff4;color:white;font-size:30px;font-weight:900;backdrop-filter:blur(5px)}
#boost{width:88px;background:#ffb000cc;color:#111;font-size:15px}
@media(min-width:800px){.ctrl{width:82px;height:82px}.top{font-size:18px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top">
  <div class="badge">🏁 STREET DRIVE V2</div>
  <div class="badge">⭐ <span id="score">0</span></div>
  <div class="badge">💰 <span id="coins">0</span></div>
 </div>
</div>
<div id="controls">
 <div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="pad"><button class="ctrl" id="boost">BOOST</button></div>
</div>
<div id="menu">
 <div class="card">
  <h1>STREET DRIVE</h1>
  <p>V2 • shmang trafikun, mblidh monedhat dhe arrij sa më larg.</p>
  <button id="start">START GAME</button>
 </div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,playing=false,score=0,coins=0,speed=7,roadX=0,spawn=0,coinSpawn=0;
let keys={left:false,right:false,boost:false}, objects=[], last=0;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function road(){ 
 const horizon=H*.20, bottom=H+40, rwTop=Math.min(W*.38,260), rwBot=Math.min(W*.86,620);
 ctx.fillStyle='#1c5b2d';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#777';ctx.beginPath();ctx.moveTo(W/2-rwTop/2,horizon);ctx.lineTo(W/2+rwTop/2,horizon);ctx.lineTo(W/2+rwBot/2,bottom);ctx.lineTo(W/2-rwBot/2,bottom);ctx.closePath();ctx.fill();
 ctx.fillStyle='#2d2d32';ctx.beginPath();ctx.moveTo(W/2-rwTop*.44,horizon);ctx.lineTo(W/2+rwTop*.44,horizon);ctx.lineTo(W/2+rwBot*.44,bottom);ctx.lineTo(W/2-rwBot*.44,bottom);ctx.closePath();ctx.fill();
 // lane markings
 ctx.strokeStyle='#fff9';ctx.lineWidth=5;ctx.setLineDash([32,28]);ctx.lineDashOffset=roadX;
 for(let x of [-.18,.18]){ctx.beginPath();ctx.moveTo(W/2+x*rwTop,horizon);ctx.lineTo(W/2+x*rwBot,bottom);ctx.stroke()}
 ctx.setLineDash([]);
}
function car(x,y,w,h,color){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#0006';ctx.fillRect(-w*.52,h*.32,w*1.04,h*.16);
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,12);ctx.fill();
 ctx.fillStyle='#172334';ctx.beginPath();ctx.roundRect(-w*.31,-h*.34,w*.62,h*.34,7);ctx.fill();
 ctx.fillStyle='#dce9ff';ctx.fillRect(-w*.38,-h*.43,w*.17,h*.08);ctx.fillRect(w*.21,-h*.43,w*.17,h*.08);
 ctx.fillStyle='#111';ctx.fillRect(-w*.57,-h*.28,w*.12,h*.25);ctx.fillRect(w*.45,-h*.28,w*.12,h*.25);
 ctx.restore();
}
function playerX(){return W/2 + roadX}
function spawnObj(){
 const lane=[-.27,0,.27][Math.floor(Math.random()*3)];
 objects.push({type:'car',lane,x:lane,y:-100,z:0,color:['#e74c3c','#3498db','#f1c40f','#9b59b6'][Math.floor(Math.random()*4)]});
}
function spawnCoin(){const lane=[-.27,0,.27][Math.floor(Math.random()*3)];objects.push({type:'coin',lane,x:lane,y:-50,z:0})}
function update(dt){
 const boost=keys.boost?1.55:1;
 speed += ((7*boost)-speed)*dt*2;
 roadX += ((keys.right?1:0)-(keys.left?1:0))*W*.85*dt;
 roadX=Math.max(-W*.28,Math.min(W*.28,roadX));
 spawn-=dt;coinSpawn-=dt;
 if(spawn<=0){spawnObj();spawn=0.85+Math.random()*.55}
 if(coinSpawn<=0){spawnCoin();coinSpawn=1.1+Math.random()*1.2}
 for(const o of objects){o.y+=speed*95*dt;o.z+=dt}
 objects=objects.filter(o=>{
   const ox=W/2+o.lane*Math.min(W*.86,620);
   if(o.type==='coin'){
     if(Math.abs(ox-playerX())<55 && Math.abs(o.y-(H-130))<55){coins++;score+=25;return false}
   }else{
     if(Math.abs(ox-playerX())<55 && Math.abs(o.y-(H-130))<90){playing=false;document.getElementById('menu').style.display='flex';document.querySelector('.card p').textContent='💥 Përplasje! Rezultati: '+score+' • Monedha: '+coins;document.getElementById('start').textContent='RESTART';return false}
   }
   return o.y<H+120
 });
 score+=Math.floor(speed*dt*2);
 document.getElementById('score').textContent=score;
 document.getElementById('coins').textContent=coins;
}
function draw(){
 ctx.clearRect(0,0,W,H);road();
 const horizon=H*.2, roadBottom=Math.min(W*.86,620);
 for(const o of objects){
   const perspective=Math.max(0,Math.min(1,(o.y-horizon)/(H*.8)));
   const ox=W/2+o.lane*(Math.min(W*.86,620)*(.35+.65*perspective));
   if(o.type==='coin'){
     ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(ox,o.y,13+10*perspective,0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#fff4a0';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('€',ox,o.y+5);
   }else car(ox,o.y,42+30*perspective,72+50*perspective,o.color);
 }
 car(playerX(),H-125,58,100,'#16d9ff');
 if(keys.boost){ctx.fillStyle='#ffb000';ctx.beginPath();ctx.moveTo(playerX()-13,H-73);ctx.lineTo(playerX(),H-28);ctx.lineTo(playerX()+13,H-73);ctx.fill()}
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function bind(id,key){
 const el=document.getElementById(id);
 ['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true},{passive:false}));
 ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false},{passive:false}));
}
bind('left','left');bind('right','right');bind('boost','boost');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.code==='Space')keys.boost=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.code==='Space')keys.boost=false});
document.getElementById('start').onclick=()=>{
 playing=true;score=0;coins=0;speed=7;roadX=0;objects=[];spawn=.2;coinSpawn=.5;
 document.getElementById('menu').style.display='none';document.getElementById('start').textContent='START GAME';
};
</script>
</body></html>
